[flake8]
max-line-length = 79
exclude = .git,__pycache__,build,dist,.mypy_cache,.venv

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-mazegenerator.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = True
